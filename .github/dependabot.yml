version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 버전이 서로 묶여 있는 것들은 한 PR 로 받아야 빌드가 깨지지 않는다.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      compose:
        patterns:
          - "androidx.compose*"
      hilt:
        patterns:
          - "com.google.dagger*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
