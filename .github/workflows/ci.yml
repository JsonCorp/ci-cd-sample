name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # 문서만 고친 push 는 돌리지 않는다. PR 에서는 paths-ignore 를 걸지 않으므로
    # 상태 검사(required check)가 항상 붙는다.
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 취소한다. 무료 사용량을 아끼는 가장 쉬운 방법.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1층: 단위 테스트 + 린트 ────────────────────────────────────────────────
  # 에뮬레이터도 SDK 설치도 필요 없다. 로직 결함은 대부분 여기서 잡힌다.
  unit-test:
    name: 단위 테스트 & 린트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 저장소에 커밋된 gradle-wrapper.jar 가 정품 배포본인지 확인한다.
      # setup-gradle 이 자동으로 해주지 않는다 — 별도 액션이고, 비용은 10초 미만이다.
      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: JDK 17 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 배포판·의존성·빌드 캐시를 한 번에 관리한다.
      # PR 잡은 캐시를 읽기만 하고 쓰지 않아(기본 동작) main 의 캐시가 오염되지 않는다.
      - name: Gradle 설정 및 캐시
        uses: gradle/actions/setup-gradle@v6

      - name: 단위 테스트
        run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest

      # 테스트가 깨져도 린트는 돈다. 한 번의 푸시로 고쳐야 할 것을 전부 보여준다.
      # always() 는 취소된 실행에서도 참이라 cancel-in-progress 와 함께 쓰면 헛돈다.
      - name: 린트
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug

      - name: 테스트 집계를 요약에 적기
        if: always()
        run: |
          # grep 결과가 비면 paste 가 빈 문자열을 넘겨 bc 가 조용히 실패한다.
          # 합계 함수로 감싸 0 을 기본값으로 돌려준다.
          sum_attr() {
            local attr="$1"; shift
            local expr
            expr=$(grep -ho "$attr=\"[0-9]*\"" "$@" 2>/dev/null | grep -o '[0-9]*' | paste -sd+)
            if [ -z "$expr" ]; then echo 0; else echo "$expr" | bc; fi
          }

          {
            echo "## 단위 테스트 결과"
            echo ""
            echo "| 모듈 | 테스트 | 실패 | 스킵 |"
            echo "|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          total=0; failed=0
          for module in domain data app; do
            mapfile -t files < <(find "$module" -path "*test-results*" -name "TEST-*.xml" 2>/dev/null)
            [ "${#files[@]}" -eq 0 ] && continue
            t=$(sum_attr tests "${files[@]}")
            f=$(sum_attr failures "${files[@]}")
            s=$(sum_attr skipped "${files[@]}")
            echo "| \`:$module\` | $t | $f | $s |" >> "$GITHUB_STEP_SUMMARY"
            total=$((total + t)); failed=$((failed + f))
          done
          echo "| **합계** | **$total** | **$failed** | |" >> "$GITHUB_STEP_SUMMARY"

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

  # ── 2층: Compose UI 테스트 ────────────────────────────────────────────────
  # Gradle Managed Devices(GMD) 로 AVD 를 Gradle 이 직접 관리한다.
  # unit-test·build 와 병렬로 돌므로 전체 파이프라인 시간은 늘지 않는다.
  # aosp-atd 는 테스트 전용 경량 이미지라 부팅이 google_apis 보다 눈에 띄게 빠르다.
  ui-test:
    name: Compose UI 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: JDK 17 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정 및 캐시
        uses: gradle/actions/setup-gradle@v6

      - name: KVM 권한 열기 (에뮬레이터 하드웨어 가속)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # actions/cache 의 path 는 러너의 OS 환경변수를 전개하지 않는다.
      # ${{ env.X }} 는 워크플로가 정의한 env 만 본다 — $GITHUB_ENV 로 한 번 실어 줘야 한다.
      - name: SDK 경로를 env 로 노출
        run: echo "SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      # 시스템 이미지 다운로드가 첫 실행의 대부분(2~3분)을 차지한다. 이미지와 AVD 를 함께 캐시한다.
      # 키에 연월을 넣어 이미지 리비전이 갱신되면 자연히 무효화되게 한다.
      # actions/cache 는 잡이 실패하면 저장하지 않는다(post-if: success()).
      # UI 테스트를 고치는 동안 이미지를 매번 다시 받게 되므로 restore/save 를 분리한다.
      - name: GMD 시스템 이미지 · AVD 캐시 복원
        id: gmd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
            ~/.android/gradle/avd
            ${{ env.SDK_ROOT }}/system-images
          key: gmd-pixel6api30-aosp-atd-2026-08

      - name: connectedAndroidTest (관리형 디바이스)
        run: ./gradlew :app:pixel6api30DebugAndroidTest

      - name: GMD 캐시 저장 (테스트가 깨져도 저장한다)
        if: ${{ !cancelled() && steps.gmd-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          # GitHub Actions 는 YAML 앵커를 지원하지 않아 경로를 그대로 반복한다.
          path: |
            ~/.android/avd
            ~/.android/adb*
            ~/.android/gradle/avd
            ${{ env.SDK_ROOT }}/system-images
          key: gmd-pixel6api30-aosp-atd-2026-08

      - name: UI 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  # ── 2층: 디버그 APK 빌드 ──────────────────────────────────────────────────
  # 단위 테스트와 병렬로 돈다. 여기서 만든 APK 를 E2E 잡이 그대로 내려받아 쓴다.
  build:
    name: 디버그 APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: JDK 17 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정 및 캐시
        uses: gradle/actions/setup-gradle@v6

      - name: assembleDebug
        run: ./gradlew assembleDebug

      - name: APK 크기를 요약에 적기
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          size=$(du -h "$apk" | cut -f1)
          {
            echo "## 빌드 산출물"
            echo ""
            echo "| 산출물 | 크기 |"
            echo "|---|---:|"
            echo "| \`app-debug.apk\` | $size |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK 보관
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ── 3층: 에뮬레이터 E2E ───────────────────────────────────────────────────
  # 가장 느리고 가장 잘 깨지는 잡. 앞 단계가 실패하면 아예 돌지 않도록 needs 로 묶는다.
  # unit-test 가 깨진 채로 에뮬레이터를 5분 태우지 않는다.
  e2e:
    name: Maestro E2E (에뮬레이터)
    runs-on: ubuntu-latest
    needs: [build, unit-test]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 빌드 잡이 만든 APK 내려받기
        uses: actions/download-artifact@v8
        with:
          name: app-debug-apk
          path: artifacts

      - name: KVM 권한 열기 (에뮬레이터 하드웨어 가속)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro CLI 설치
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # AVD 생성에만 2~3분이 든다. 스냅샷을 캐시하면 두 번째 실행부터 부팅이 크게 짧아진다.
      # 키에 연월을 넣어 시스템 이미지 리비전이 바뀌면 자연히 새로 만들어지게 한다.
      - name: AVD 캐시
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # restore-keys 를 두면 접두사 매칭으로 지난달의 낡은 AVD 가 복원되고,
          # force-avd-creation: false 가 그걸 그대로 재사용해 날짜 키가 무의미해진다.
          key: avd-api30-google_apis-x86_64-2026-08

      - name: AVD 스냅샷 만들기 (캐시가 없을 때만)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD 스냅샷 생성 완료"

      - name: Maestro 플로우 실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # script 는 sh -c 로 통째로 넘어간다. 백슬래시 줄바꿈을 쓰면 `\` 가 인자로 남아
          # "Flow path does not exist: \" 로 실패한다 — 긴 명령도 한 줄로 쓴다.
          # --flatten-debug-output: 실패 스크린샷을 타임스탬프 폴더 없이 한곳에 모아
          # 아티팩트에서 바로 찾을 수 있게 한다.
          script: |
            adb install -r artifacts/app-debug.apk
            mkdir -p reports
            maestro test .maestro/ --format HTML-DETAILED --output reports/report.html --debug-output reports/debug --flatten-debug-output

      - name: E2E 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: reports/
          retention-days: 7

  # ── 공급망: 의존성 그래프 제출 ────────────────────────────────────────────
  # GitHub 의 의존성 그래프는 Gradle 을 네이티브로 파싱하지 못한다(Maven 의 pom.xml 과 다르다).
  # 스냅샷을 제출해야 (a) Dependabot 취약점 *알림* 이 켜지고,
  # (b) dependency-review 가 base↔head 를 비교할 대상이 생긴다.
  # PR head 에도 제출하지 않으면 dependency-review 는 변경 없음으로 보고 항상 통과한다.
  # 포크 PR 은 토큰이 읽기 전용이라 제출할 수 없다 — 그 경우 검토 잡도 함께 건너뛴다.
  dependency-submission:
    name: 의존성 그래프 제출
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/dependency-submission@v6

  # ── 공급망: PR 로 새로 들어오는 취약 의존성 차단 ──────────────────────────
  dependency-review:
    name: 의존성 검토
    runs-on: ubuntu-latest
    needs: dependency-submission
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # PR 코멘트 요약은 pull-requests: write 가 필요하다. 상태 검사와 잡 로그로 충분하므로 켜지 않는다.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── 실패를 사람에게 알리기 ────────────────────────────────────────────────
  # 외부 서비스나 시크릿 없이 GITHUB_TOKEN 만으로 동작한다.
  # 포크에서 온 PR 의 GITHUB_TOKEN 은 읽기 전용이라 permissions 를 적어도 승격되지 않는다.
  # 같은 저장소에서 온 PR 로 한정하고, 알림 실패가 CI 결론을 흐리지 않게 continue-on-error 를 건다.
  notify:
    name: 실패 시 PR 코멘트
    runs-on: ubuntu-latest
    needs: [unit-test, ui-test, build, e2e, dependency-review]
    if: >-
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '❌ **CI 가 실패했습니다.**',
              '',
              `- 실행 로그: ${runUrl}`,
              '- 단위 테스트/린트 리포트: Artifacts → `unit-test-and-lint-reports`',
              '- Compose UI 테스트 리포트: Artifacts → `ui-test-reports`',
              '- E2E 실패 스크린샷: Artifacts → `maestro-report` (`reports/report.html`, `reports/debug/`)',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
