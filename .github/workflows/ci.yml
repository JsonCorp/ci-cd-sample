name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # 문서만 고친 push 는 돌리지 않는다. PR 에서는 paths-ignore 를 걸지 않으므로
    # 상태 검사(required check)가 항상 붙는다.
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 취소한다. 무료 사용량을 아끼는 가장 쉬운 방법.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1층: 단위 테스트 + 린트 ────────────────────────────────────────────────
  # 에뮬레이터도 SDK 설치도 필요 없다. 로직 결함은 대부분 여기서 잡힌다.
  unit-test:
    name: 단위 테스트 & 린트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 배포판·의존성·빌드 캐시를 한 번에 관리한다.
      # PR 잡은 캐시를 읽기만 하고 쓰지 않아(기본 동작) main 의 캐시가 오염되지 않는다.
      - name: Gradle 설정 및 캐시
        uses: gradle/actions/setup-gradle@v6

      - name: 단위 테스트
        run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest

      - name: 린트
        run: ./gradlew lintDebug

      - name: 테스트 집계를 요약에 적기
        if: always()
        run: |
          {
            echo "## 단위 테스트 결과"
            echo ""
            echo "| 모듈 | 테스트 | 실패 | 스킵 |"
            echo "|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          total=0; failed=0
          for module in domain data app; do
            files=$(find "$module" -path "*test-results*" -name "TEST-*.xml" 2>/dev/null || true)
            [ -z "$files" ] && continue
            t=$(grep -ho 'tests="[0-9]*"' $files | grep -o '[0-9]*' | paste -sd+ | bc)
            f=$(grep -ho 'failures="[0-9]*"' $files | grep -o '[0-9]*' | paste -sd+ | bc)
            s=$(grep -ho 'skipped="[0-9]*"' $files | grep -o '[0-9]*' | paste -sd+ | bc)
            echo "| \`:$module\` | $t | $f | $s |" >> "$GITHUB_STEP_SUMMARY"
            total=$((total + t)); failed=$((failed + f))
          done
          echo "| **합계** | **$total** | **$failed** | |" >> "$GITHUB_STEP_SUMMARY"

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

  # ── 2층: 디버그 APK 빌드 ──────────────────────────────────────────────────
  # 단위 테스트와 병렬로 돈다. 여기서 만든 APK 를 E2E 잡이 그대로 내려받아 쓴다.
  build:
    name: 디버그 APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정 및 캐시
        uses: gradle/actions/setup-gradle@v6

      - name: assembleDebug
        run: ./gradlew assembleDebug

      - name: APK 크기를 요약에 적기
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          size=$(du -h "$apk" | cut -f1)
          {
            echo "## 빌드 산출물"
            echo ""
            echo "| 산출물 | 크기 |"
            echo "|---|---:|"
            echo "| \`app-debug.apk\` | $size |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK 보관
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ── 3층: 에뮬레이터 E2E ───────────────────────────────────────────────────
  # 가장 느리고 가장 잘 깨지는 잡. 앞 단계가 실패하면 아예 돌지 않도록 needs 로 묶는다.
  e2e:
    name: Maestro E2E (에뮬레이터)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 빌드 잡이 만든 APK 내려받기
        uses: actions/download-artifact@v8
        with:
          name: app-debug-apk
          path: artifacts

      - name: KVM 권한 열기 (에뮬레이터 하드웨어 가속)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro CLI 설치
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # AVD 생성에만 2~3분이 든다. 스냅샷을 캐시하면 두 번째 실행부터 부팅이 크게 짧아진다.
      - name: AVD 캐시
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-google_apis-x86_64

      - name: AVD 스냅샷 만들기 (캐시가 없을 때만)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD 스냅샷 생성 완료"

      - name: Maestro 플로우 실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # script 는 sh -c 로 통째로 넘어간다. 백슬래시 줄바꿈을 쓰면 `\` 가 인자로 남아
          # "Flow path does not exist: \" 로 실패한다 — 긴 명령도 한 줄로 쓴다.
          # --flatten-debug-output: 실패 스크린샷을 타임스탬프 폴더 없이 한곳에 모아
          # 아티팩트에서 바로 찾을 수 있게 한다.
          script: |
            adb install -r artifacts/app-debug.apk
            mkdir -p reports
            maestro test .maestro/ --format HTML-DETAILED --output reports/report.html --debug-output reports/debug --flatten-debug-output

      - name: E2E 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: reports/
          retention-days: 7

  # ── 실패를 사람에게 알리기 ────────────────────────────────────────────────
  # 외부 서비스나 시크릿 없이 GITHUB_TOKEN 만으로 동작한다.
  notify:
    name: 실패 시 PR 코멘트
    runs-on: ubuntu-latest
    needs: [unit-test, build, e2e]
    if: failure() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '❌ **CI 가 실패했습니다.**',
              '',
              `- 실행 로그: ${runUrl}`,
              '- 단위 테스트/린트 리포트: Artifacts → `unit-test-and-lint-reports`',
              '- E2E 실패 스크린샷: Artifacts → `maestro-report` (`reports/report.html`, `reports/debug/`)',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
