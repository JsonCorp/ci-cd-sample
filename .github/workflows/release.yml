name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "빌드까지만 하고 릴리스는 만들지 않는다"
        type: boolean
        default: true

permissions:
  contents: write # gh release create 에 필요

jobs:
  release:
    name: 서명 릴리스
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 준비
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정 및 캐시
        uses: gradle/actions/setup-gradle@v6

      # 태그와 앱 버전이 어긋난 채로 릴리스가 나가면 나중에 어느 커밋인지 추적할 수 없다.
      # 빌드 전에 먼저 막는다.
      - name: 태그와 versionName 일치 확인
        id: version
        run: |
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if [ "$tag" != "v$version_name" ]; then
              echo "::error::태그($tag)와 versionName($version_name)이 다릅니다. 태그는 v$version_name 이어야 합니다."
              exit 1
            fi
            echo "태그 $tag ↔ versionName $version_name 일치"
          else
            echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          fi

      # 공개 저장소이므로 시크릿이 없는 포크에서도 빌드는 통과해야 한다.
      # 키스토어가 없으면 서명을 건너뛰고 unsigned 로 만든다.
      - name: 키스토어 준비
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 시크릿이 없어 서명 없이 빌드합니다."
            exit 0
          fi
          # 잡이 끝나면 함께 사라지는 임시 디렉터리에만 푼다.
          keystore_path="${RUNNER_TEMP}/release.jks"
          # 시크릿을 Windows 에서 등록하면 CR 이나 줄바꿈이 섞여 들어가 base64 가 invalid input 으로
          # 실패한다. 디코드 전에 공백류를 전부 걷어낸다.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore_path"
          echo "path=$keystore_path" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 릴리스 빌드
        env:
          # versionCode 는 실행 번호로 만든다 — 태그를 다시 밀어도 항상 증가한다.
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: 산출물 이름 정리
        id: artifacts
        run: |
          mkdir -p dist
          version="${{ steps.version.outputs.version_name }}"
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          aab=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$apk" "dist/ci-cd-sample-${version}.apk"
          cp "$aab" "dist/ci-cd-sample-${version}.aab"
          ls -lh dist

          {
            echo "## 릴리스 산출물"
            echo ""
            echo "| 파일 | 크기 | 서명 |"
            echo "|---|---:|---|"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | ${{ steps.keystore.outputs.signed == 'true' && '서명됨' || '미서명' }} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 산출물 보관
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30

      - name: GitHub Release 게시
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="자동 생성 릴리스입니다."
          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            notes="$notes

          > 이 빌드는 서명 시크릿이 없어 **미서명(unsigned)** 상태입니다. 기기에 바로 설치할 수 없습니다."
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            dist/* \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes "$notes"

      - name: dry run 안내
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "::notice::dry_run 이라 릴리스를 만들지 않았습니다. 산출물은 Artifacts 에서 확인하세요."
