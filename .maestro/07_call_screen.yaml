appId: com.example.cicdsample
name: 통화 화면 — 탭으로 들어가면 내 주소가 보이고, 읽을 수 없는 SDP 는 거부한다
---
# 통화 자체는 상대 단말이 있어야 하므로 여기서 확인하는 것은 '화면 배선'이다 —
# 탭 이동, 통화 전에 내 주소가 정해지는 것, SDP 해석 실패가 사용자에게 보이는 것.
- runFlow: common/launch_clean.yaml

# 앱은 할 일 화면에서 시작한다
- assertVisible:
    id: "text_empty"

- tapOn:
    id: "tab_call"

# 내 주소와 SDP 는 통화보다 먼저 정해진다 — 상대에게 건네야 상대가 어디로 보낼지 안다
- assertVisible:
    id: "text_call_stage"
    text: "통화 대기"
- assertVisible:
    id: "text_local_address"
- assertVisible:
    id: "text_local_sdp"

# 상대 주소가 비어 있으면 통화 버튼은 눌러도 아무 일이 없다(비활성).
# 마이크 권한 대화상자가 뜨지 않는 것까지 이 단정이 함께 확인한다.
- tapOn:
    id: "btn_call_start"
- assertVisible:
    id: "text_call_stage"
    text: "통화 대기"

# 읽을 수 없는 SDP 는 안내 문구로 돌아온다
- tapOn:
    id: "input_remote_sdp"
# Maestro 의 inputText 는 ASCII 만 넣을 수 있다 — 입력값만 영문으로 쓴다.
- inputText: "not a sdp"
- hideKeyboard
- tapOn:
    id: "btn_apply_sdp"
- assertVisible:
    id: "text_call_error"

# 주소를 직접 넣으면 통화 버튼이 열린다.
# 여기서 통화를 걸면 마이크 권한 대화상자가 떠 흐름이 기기 설정에 좌우되므로 누르지 않는다.
- tapOn:
    id: "input_peer_host"
- inputText: "192.168.0.9"
- hideKeyboard
- assertVisible:
    id: "input_peer_host"
    text: "192.168.0.9"

# 탭을 되돌리면 할 일 화면은 그대로다
- tapOn:
    id: "tab_task"
- assertVisible:
    id: "text_empty"
