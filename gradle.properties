org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# 모듈이 3개라 병렬 실행과 빌드 캐시가 실제로 효과를 낸다 (CI 시간 단축의 절반은 여기서 나온다).
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 관리형 디바이스(GMD)를 헤드리스 CI 에서 띄울 때는 소프트웨어 렌더러를 써야 한다.
# 기본값(auto)은 GPU 가 없는 러너에서 부팅에 실패하거나 매우 느려진다.
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
